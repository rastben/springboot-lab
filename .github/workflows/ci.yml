name: CI

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-varsion: '21'
                cache: maven

            - name: Run test
              run: ./mvnw test
