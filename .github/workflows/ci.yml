name: CI

on:
    push:
        branches:
            - develop
    pull_request:
        branches:
            - develop

jobs:
    test:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up Java 21
              uses: actions/setup-java@v6
              with:
                distribution: temurin
                java-version: '21'
                cache: maven

            - name: Run test
              run: ./mvnw -B test

            - name: Build application
              run: ./mvnw -B package -DskipTests
